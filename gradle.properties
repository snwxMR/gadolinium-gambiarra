# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.caching=true
# Gradle needs JDK 25: it finds an installed one, or set org.gradle.java.installations.paths in ~/.gradle/gradle.properties.

# ---------------------------------------------------------------------------
# Minecraft / Cleanroom
# ---------------------------------------------------------------------------
mc_version=1.12.2
mappings_version=39-1.12
# The Cleanroom the code compiles against. The mods need 0.7.14 or newer at run time (cleanroom_required, shown in the packages)
cleanroom_version=0.6.13-alpha
cleanroom_required=0.7.14-alpha
unimined_version=1.4.36-kappa

# ---------------------------------------------------------------------------
# Mod
# ---------------------------------------------------------------------------
mod_id=gadolinium
mod_name=Gadolinium
# Gadolinium's version (MAJOR.MINOR.PATCH). Each new package (distTeste) has a new version:
# PATCH for a package with fixes only, MINOR for a new feature. Before the package is made, the
# version needs an entry in CHANGELOG.md; distTeste refuses a version already used.
mod_version=1.0.0
# Gambiarra's version (the other mod in this repository, since the 0.11.0 split): the same rules, with gambiarra-vX.Y.Z
# tags and CHANGELOG-Gambiarra.md.
gambiarra_version=1.0.0

# ---------------------------------------------------------------------------
# Target mods: only READ from these paths (never copied into the repository). Set your own paths in
# ~/.gradle/gradle.properties (see CONTRIBUTING.md).
# OptiFine's expected sha256 is checked by the build.
# ---------------------------------------------------------------------------
target_mods_dir=/path/to/instance/mods
nothirium_jar=Nothirium-1.12.2-0.4.9-beta.jar
nothirium_sha256=a86e5aa4fd09b6fd782da9d797ca9e4ab32de4453cf762e1aa3212dfb9e27d12
renderlib_jar=RenderLib-1.12.2-1.4.5.jar
renderlib_sha256=eeca6dc4ef5acf3069e4b8747e4dbfa253323cc44cd90c8ddb6d70587fe0d35f
# Cleanroom's patch mods, used only by the test environment (not in this repository); the keys have to exist
fugue_jar=+Fugue-0.25.5.jar
scalar_jar=scalar-3.10.0.jar
$1
recurrentcomplex_jar=RecurrentComplexVolts-1.12.2-2.0.1.4.jar
recurrentcomplex_sha256=6e6b4aef94f7fd86eebed8d4f7b5c82dabe00b77e3289ebdb1fe7aecbf237257
ivtoolkit_jar=IvToolkit-1.3.3-1.12.jar
ivtoolkit_sha256=ffb745111790e27cb7810a2e03d5270265dee7ebd3ef98fde897c409d58b1e59
# RTG Continued and Additional Structures: only to compile the worldgen module (nthrc); Pulsar: the chunk resend
# (nthrc.pulsar); Biomes O' Plenty and Xaero's World Map: only to
# compile the fog colour (nthrc.bop) and the map flush (nthrc.xaero), Gambiarra 0.4.0
pulsar_jar=pulsar-0.6.6-beta.jar
rtgc_jar=rtgc-1.0.7.jar
additionalstructures_jar=Rex's-AdditionalStructures-1.12.x(v.2.5.0).jar
biomesoplenty_jar=BiomesOPlenty-1.12.2-7.0.1.2445-universal.jar
xaeroworldmap_jar=xaeroworldmap-forge-1.12.2-1.47.0.jar
# Ice and Fire and LLibrary: only to compile the dragon animation fix (nthcompat.iceandfire)
iceandfire_jar=iceandfire-1.9.1-1.12.2.jar
# Lycanites Mobs: only to compile the LOD on its .obj models (gambiarra.lod.LycanitesLod)
lycanites_jar=lycanitesmobs-1.12.2-2.0.8.10.jar
llibrary_jar=llibrary-1.7.20-1.12.2.jar

# The official OptiFine jar (read only; it has to have this SHA-256).
optifine_jar_path=/path/to/OptiFine_1.12.2_HD_U_G5.jar
optifine_sha256=3b0006797771feb97f2d0d2908ae7c9a78cefb2e730af1c2e85d08a839ba271e

# OptiRefine: both accepted builds are built locally from source (see gradle/optirefine.gradle):
# 78ff8ce (the build before there was a release) and 6c4855e (the v0.1.0-alpha release).
optirefine_repo=https://github.com/Ecdcaeb/OptiRefine.git
optirefine_commits=78ff8ce408e6687093d95f19218ffda3214c0475,6c4855e9d82ff7f004291833c4eb1098fe4bfc8e
# The one that goes into Gadolinium's test package and into the GitHub release: 78ff8ce, the only one that starts with
# Nothirium (v0.1.0-alpha does not, see docs). Its build has to come out with this SHA-256, the jar every test used.
# (The release, 6c4855e, builds byte for byte the optirefine-0.1.0-alpha.jar on GitHub: 88c57825...)
optirefine_package_commit=78ff8ce408e6687093d95f19218ffda3214c0475
optirefine_package_name=OptiRefine-78ff8ce.jar
optirefine_package_sha256=cac7c90acc0aef84069f002c57292d276e688772f2d53aff2b26e5cc572d40ae

# ---------------------------------------------------------------------------
# checkLocks: the Cleanroom runtime downloaded by the relauncher, and Mojang's jars
# ---------------------------------------------------------------------------
cleanroom_libraries_dir=/path/to/.cleanroom/relauncher/libraries
# Cleanroom version whose binpatches checkLocks reads: the one the game runs on.
smoketest_cleanroom_version=0.7.14-alpha
# Mojang's official 1.12.2 server jar from the Unimined cache (Unimined downloads it with the client); checkLocks reads the
# client jar next to it. Read only.
minecraft_server_jar=/path/to/.gradle/caches/unimined/net/minecraft/minecraft/1.12.2/minecraft-1.12.2-server.jar
