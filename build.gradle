plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version "${unimined_version}"
}

version = "${mc_version}-${mod_version}"
group = 'gadolinium'

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 8 bytecode: the level CleanMix accepts without a warning ("JAVA_8" in
// mixins.nthshaders.json), the same as Nothirium and RenderLib.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

// Test hooks (DevHooks, one copy per mod): `main` compiles with the release version
// (ON = false, javac drops the hook code). The development jar (remapDevJar) compiles
// the same sources again with ON = true.
def releaseHooksSrc = file('src/release/java')
def devHooksSrc = file('src/dev/java')

// Version and commit of the build, from one place: mod_version and gambiarra_version (gradle.properties) and git. They go
// into the jar name, mcmod.info and each mod's generated BuildInfo, which the startup log and
// nthshaders-diagnostics.txt use. With uncommitted changes in what goes into the jar, the commit is
// marked ("+alteracoes-locais"). Version rules and the package lock: gradle/dist.gradle.
ext.gitOutput = { List<String> args ->
    try {
        def p = (['git'] + args).execute(null, rootDir)
        def out = p.text.trim()
        return p.waitFor() == 0 ? out : null
    } catch (Exception ignored) {
        return null
    }
}
ext.jarInputPaths = ['src/main', 'src/release', 'src/gambiarra', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle']
def headCommit = gitOutput(['rev-parse', '--short=7', 'HEAD'])
ext.buildCommit = headCommit == null ? 'desconhecido'
        : (gitOutput(['status', '--porcelain', '--'] + jarInputPaths) ? "${headCommit}+alteracoes-locais".toString() : headCommit)

def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo/java')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Generates nthshaders.common.BuildInfo and gambiarra.common.BuildInfo (each mod\'s version and the build commit).'
    def infoCommit = buildCommit
    // package -> [version, name, modid]
    def mods = ['nthshaders.common': [mod_version, 'Gadolinium', 'gadolinium'],
                'gambiarra.common' : [gambiarra_version, 'Gambiarra', 'gambiarra']]
    inputs.property('mods', mods.toString())
    inputs.property('commit', infoCommit)
    outputs.dir(buildInfoDir)
    doLast {
        def dir = buildInfoDir.get().asFile
        project.delete(dir)
        mods.each { pkg, info ->
            def out = new File(dir, pkg.replace('.', '/') + '/BuildInfo.java')
            out.parentFile.mkdirs()
            out.setText("""package ${pkg};

/** Generated by Gradle (task generateBuildInfo) from gradle.properties and git. Do not edit. */
public final class BuildInfo {

    /** The mod's version. */
    public static final String VERSION = "${info[0]}";
    /** The mod's name (log and diagnostics). */
    public static final String NAME = "${info[1]}";
    /** The mod id (log prefix). */
    public static final String MODID = "${info[2]}";
    /** The build commit (7 characters; "+alteracoes-locais" with uncommitted changes). */
    public static final String COMMIT = "${infoCommit}";

    private BuildInfo() {
    }

}
""", 'UTF-8')
        }
    }
}

sourceSets {
    main {
        java.srcDir(releaseHooksSrc)
        java.srcDir(generateBuildInfo)
    }
    // Build checks (checkShaders, checkLocks, checkLod): run against the mod's own classes, never go into a jar.
    buildcheck {
        java.srcDir 'ferramentas/vanilla'
        compileClasspath += files({ sourceSets.main.compileClasspath }) + main.output
        runtimeClasspath += files({ sourceSets.main.compileClasspath }) + main.output
    }
}

tasks.named('compileBuildcheckJava') {
    options.release = 25
}

tasks.register('checkShaders', JavaExec) {
    group = 'verification'
    description = 'Runs the line insertion of every shader of the two jars and fails if #version is not the first statement.'
    classpath = sourceSets.buildcheck.runtimeClasspath
    mainClass = 'nthbuild.ShaderCheck'
    args file('src/main/resources').path, file('src/gambiarra/resources').path
}

// Runs the LOD's part hooks outside the game and reads Ice and Fire's fire dragon model from the target mods (target_mods_dir).
tasks.register('checkLod', JavaExec) {
    group = 'verification'
    description = 'Checks that measuring models for the LOD never hides a part or changes level 1, and the size measured for an Ice and Fire dragon.'
    classpath = sourceSets.buildcheck.runtimeClasspath
    mainClass = 'nthbuild.LodCheck'
    workingDir = layout.buildDirectory.dir('buildcheck').get().asFile
    doFirst {
        workingDir.mkdirs()
        args targetModsDir.path, layout.buildDirectory.file('reports/lod.md').get().asFile.path
    }
}

// Needs the target mod jars (target_mods_dir), the official client jar, Cleanroom's universal jar and the mcp_config.
tasks.register('checkLocks', JavaExec) {
    group = 'verification'
    description = "Recomputes every code lock from the target mod jars and Cleanroom ${smoketest_cleanroom_version}, and fails if one does not match."
    classpath = sourceSets.buildcheck.runtimeClasspath
    mainClass = 'nthbuild.LockCheck'
    // The game's log4j configuration on the classpath writes logs/latest.log in the working folder.
    workingDir = layout.buildDirectory.dir('buildcheck').get().asFile
    doFirst {
        workingDir.mkdirs()
        def universal = file("${cleanroom_libraries_dir}/com/cleanroommc/cleanroom/${smoketest_cleanroom_version}/cleanroom-${smoketest_cleanroom_version}-universal.jar")
        def client = file((minecraft_server_jar as String).replace('-server.jar', '-client.jar'))
        [universal, client].each { if (!it.isFile()) throw new GradleException("checkLocks: ${it} not found") }
        args targetModsDir.path, client.path, universal.path, configurations.mcpConfig.singleFile.path,
                layout.buildDirectory.file('reports/locks.md').get().asFile.path, file("${depsDir}/mods").path
    }
}


repositories {
    maven { url = 'https://maven.cleanroommc.com/releases' }
    maven { url = 'https://maven.outlands.top/releases' }
    mavenCentral()
}

// Two mods in the same repository (since 0.11.0): the same `main` compiles everything and each jar takes only what is its
// own. Gadolinium (client only): nthshaders.*, nthgpu.*, the compute shaders (assets) and OptiRefine's license
// (RenderGlobalEntitiesMixin comes from it). Gambiarra (client and server): nthcompat.*, nthrc.* and gambiarra.*. The
// common base is copied into both (nthshaders.common and gambiarra.common; checkCommonCopies checks them).
ext.shadersContent = ['nthshaders/**', 'nthgpu/**', 'assets/**', 'licenses/**', 'META-INF/**', 'LICENSE', 'NOTICE', 'mcmod.info',
                      'mixins.nthshaders.json', 'mixins.nthgpu.json', 'mixins.nthshaders.compat.json']
ext.gambiarraContent = ['gambiarra/**', 'nthcompat/**', 'nthrc/**', 'mixins.nthcompat.json', 'mixins.nthcompat.*.json', 'mixins.gambiarra.*.json',
                        'mixins.nthrc.*.json']
// Only the compile-time constant is used: no class refers to DevHooks.
def devHooksClasses = ['nthshaders/common/DevHooks.class', 'gambiarra/common/DevHooks.class']

// No 'ModSide' in Gambiarra: the jar loads on both sides (with 'ModSide: CLIENT', FML ignored the whole jar on a dedicated
// server, and the worldgen part, nthrc, has to run there). The client parts stay on the client: their mixin groups only have
// a "client" list and the plugins do nothing on a dedicated server. Gadolinium has no 'ModSide' either (as up to
// 0.10.0): its @Mod is clientSideOnly and the plugins do nothing on the server.
// The mixins.nthrc.<mod>.json, mixins.nthcompat.iceandfire.json and mixins.nthcompat.pulsar.json are NOT in the manifest:
// they come in through the ILateMixinLoaders, once the regular mods are on the classpath. mixins.nthrc.vanilla.json
// (Gambiarra 0.4.0) is: its classes (EntityItem, Entity, BlockStateContainer) load in the game's Bootstrap, before that.
def shadersManifest = { Jar j ->
    j.manifest {
        attributes 'MixinConfigs': 'mixins.nthshaders.json,mixins.nthgpu.json,mixins.nthshaders.compat.json'
    }
}
def gambiarraManifest = { Jar j ->
    j.manifest {
        attributes 'MixinConfigs': 'mixins.nthcompat.json,mixins.nthcompat.oflights.json,mixins.gambiarra.lod.json,mixins.nthrc.vanilla.json'
    }
}

// Gambiarra's mcmod.info (the one in src/main/resources is Gadolinium's).
def gambiarraResources = tasks.register('processGambiarraResources', Copy) {
    description = 'Gambiarra\'s mcmod.info, with the version (gambiarra_version) and the commit.'
    inputs.property('version', gambiarra_version)
    inputs.property('commit', buildCommit)
    from 'src/gambiarra/resources'
    into layout.buildDirectory.dir('resources/gambiarra')
    filesMatching('mcmod.info') {
        expand version: gambiarra_version, commit: buildCommit
    }
}

jar {
    archiveClassifier = 'dev'
    include shadersContent
    exclude devHooksClasses
    shadersManifest(it)
}

tasks.register('gambiarraJar', Jar) {
    description = 'Gambiarra jar (MCP names).'
    archiveBaseName = 'Gambiarra'
    archiveVersion = "${mc_version}-${gambiarra_version}"
    archiveClassifier = 'dev'
    from(sourceSets.main.output) {
        include gambiarraContent
        exclude devHooksClasses
    }
    from gambiarraResources
    gambiarraManifest(it)
}

tasks.register('compileJavaDev', JavaCompile) {
    description = 'Compiles both mods with the test hooks on (DevHooks.ON = true).'
    source(sourceSets.main.java.sourceDirectories.filter { it != releaseHooksSrc })
    source(devHooksSrc)
    dependsOn generateBuildInfo
    classpath = sourceSets.main.compileClasspath
    options.annotationProcessorPath = sourceSets.main.annotationProcessorPath
    destinationDirectory = layout.buildDirectory.dir('classes/java/mainDev')
}

tasks.register('devJar', Jar) {
    description = 'Development jar (MCP names) of Gadolinium, with the test hooks.'
    archiveClassifier = 'devhooks-mcp'
    from(tasks.named('compileJavaDev').flatMap { it.destinationDirectory }) {
        include shadersContent
        exclude devHooksClasses
    }
    from(tasks.named('processResources')) {
        include shadersContent
    }
    shadersManifest(it)
}

tasks.register('gambiarraDevJar', Jar) {
    description = 'Development jar (MCP names) of Gambiarra, with the test hooks.'
    archiveBaseName = 'Gambiarra'
    archiveVersion = "${mc_version}-${gambiarra_version}"
    archiveClassifier = 'devhooks-mcp'
    from(tasks.named('compileJavaDev').flatMap { it.destinationDirectory }) {
        include gambiarraContent
        exclude devHooksClasses
    }
    from(tasks.named('processResources')) {
        include gambiarraContent
    }
    from gambiarraResources
    gambiarraManifest(it)
}

// The two copies of the common base may only differ in the package name.
tasks.register('checkCommonCopies') {
    group = 'verification'
    description = 'Checks that nthshaders.common and gambiarra.common are the same base (only the package changes).'
    def pairs = [['src/main/java/nthshaders/common', 'src/main/java/gambiarra/common'],
                 ['src/release/java/nthshaders/common', 'src/release/java/gambiarra/common'],
                 ['src/dev/java/nthshaders/common', 'src/dev/java/gambiarra/common']]
    pairs.each { p -> inputs.dir(p[0]); inputs.dir(p[1]) }
    def marker = layout.buildDirectory.file('checkCommonCopies.ok')
    outputs.file(marker)
    doLast {
        def problems = []
        pairs.each { p ->
            def a = file(p[0]), b = file(p[1])
            def namesA = (a.list() ?: [] as String[]).toList().sort(), namesB = (b.list() ?: [] as String[]).toList().sort()
            if (namesA != namesB) {
                problems << "${p[0]} and ${p[1]} have different files: ${(namesA - namesB) + (namesB - namesA)}"
                return
            }
            namesA.each { n ->
                // The package name (comments included) becomes the same marker in both copies.
                def normalize = { File f -> f.getText('UTF-8').replace('\r\n', '\n').replaceFirst('^// SPDX-License-Identifier: [^\n]*\n', '').replace('nthshaders.common', '<pacote>').replace('gambiarra.common', '<pacote>') }
                def ta = normalize(new File(a, n))
                def tb = normalize(new File(b, n))
                if (ta != tb) {
                    problems << "${p[0]}/${n} differs from its copy in ${p[1]} (beyond the package)"
                }
            }
        }
        if (problems) {
            throw new GradleException("Common base copies differ:\n" + problems.join('\n'))
        }
        marker.get().asFile.text = 'ok'
    }
}
tasks.named('compileJava') { dependsOn 'checkCommonCopies' }


unimined.minecraft {
    version "${mc_version}"

    mappings {
        mcp("stable", "${mappings_version}")
    }

    cleanroom {
        loader "com.cleanroommc:cleanroom:${cleanroom_version}"
    }

    defaultRemapJar = false

    // Gadolinium (MCP -> SRG names). The refmap serves the nthshaders.mixin.compat mixins,
    // which target vanilla classes (RenderGlobal) by their MCP names.
    remap(tasks.jar, 'remapJar') {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    // Gadolinium with the test hooks (development only).
    remap(tasks.devJar, 'remapDevJar') {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
        archiveClassifier = 'devhooks'
    }

    // Gambiarra (MCP -> SRG names). The refmap serves the nthcompat mixins, which target vanilla classes by their MCP names.
    remap(tasks.gambiarraJar, 'remapGambiarraJar') {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
        archiveBaseName = 'Gambiarra'
        archiveVersion = "${mc_version}-${gambiarra_version}"
        archiveClassifier = ''
    }

    // Gambiarra with the test hooks (development only).
    remap(tasks.gambiarraDevJar, 'remapGambiarraDevJar') {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
        archiveBaseName = 'Gambiarra'
        archiveVersion = "${mc_version}-${gambiarra_version}"
        archiveClassifier = 'devhooks'
    }

}

apply from: 'gradle/deps.gradle'

dependencies {
    // OptiFine's classes remapped notch -> SRG from YOUR official jar (made by :prepareOptiFineSrg).
    // Compile only; never packaged.
    compileOnly files(optiFineSrgJar).builtBy('prepareOptiFineSrg')
    // The official Nothirium and RenderLib, read from the mods folder. Compile only.
    compileOnly files(nothiriumJar, renderLibJar)
    // Recurrent Complex Volts and IvToolkit, read from the mods folder: the server module (nthrc). Compile only; never
    // packaged.
    compileOnly files(recurrentComplexJar, ivToolkitJar)
    // Pulsar, RTG Continued and Additional Structures: the worldgen module (nthrc). Compile only; never packaged.
    compileOnly files(worldgenTargetJars)
    // Ice and Fire and LLibrary: the dragon animation fix (nthcompat.iceandfire). Compile only; never packaged.
    compileOnly files(iceAndFireJars)
    // Lycanites Mobs: the LOD on its .obj models (gambiarra.lod.LycanitesLod). Compile only; never packaged.
    compileOnly files(lycanitesJar)
}

processResources {
    inputs.property('version', mod_version)
    inputs.property('commit', buildCommit)
    filesMatching('mcmod.info') {
        expand version: mod_version, commit: buildCommit
    }
}


// `build` has to produce the reobfuscated (SRG) jars, not the dev ones.
tasks.named('build') {
    dependsOn 'remapJar', 'remapGambiarraJar'
}

// Unimined puts `Fabric-Loom-Mixin-Remap-Type` into the manifest while
// remapping; Cleanroom ignores it, but it is taken out so the jar stays clean.
def stripLoomManifest = { Task t ->
    t.doLast {
        def jarPath = t.outputs.files.singleFile.toPath()
        java.nio.file.FileSystems.newFileSystem(jarPath, (ClassLoader) null).withCloseable { fs ->
            def mf = fs.getPath('META-INF/MANIFEST.MF')
            def manifest = java.nio.file.Files.newInputStream(mf).withCloseable { new java.util.jar.Manifest(it) }
            if (manifest.mainAttributes.remove(new java.util.jar.Attributes.Name('Fabric-Loom-Mixin-Remap-Type')) != null) {
                def out = new ByteArrayOutputStream()
                manifest.write(out)
                java.nio.file.Files.write(mf, out.toByteArray())
            }
        }
    }
}
tasks.named('remapJar').configure { stripLoomManifest(it) }
tasks.named('remapDevJar').configure { stripLoomManifest(it) }
tasks.named('remapGambiarraJar').configure { stripLoomManifest(it) }
tasks.named('remapGambiarraDevJar').configure { stripLoomManifest(it) }

apply from: 'gradle/optirefine.gradle'
apply from: 'gradle/dist.gradle'

// Unimined's remap always adds "refmap" to every mixin group (e.g. mixins.nthshaders.json),
// but the groups with nothing to remap get no refmap (everything remap = false). The key is taken out so
// Mixin does not warn about a missing file.
['remapJar', 'remapDevJar', 'remapGambiarraJar', 'remapGambiarraDevJar'].each { taskName -> tasks.named(taskName).configure { t ->
    t.doLast {
        def jarPath = t.outputs.files.singleFile.toPath()
        java.nio.file.FileSystems.newFileSystem(jarPath, (ClassLoader) null).withCloseable { fs ->
            // Every mixin group in the jar (mixins.nthshaders*, mixins.nthgpu; mixins.nthcompat*, mixins.nthrc.<mod>).
            def configs = java.nio.file.Files.list(fs.getPath('/')).withCloseable { s ->
                s.map { it.fileName.toString() }.filter { it.startsWith('mixins.') && it.endsWith('.json') && !it.contains('refmap') }
                        .collect(java.util.stream.Collectors.toList())
            }
            configs.each { name ->
                def cfg = fs.getPath(name)
                def json = new groovy.json.JsonSlurper().parse(java.nio.file.Files.newInputStream(cfg))
                if (json.refmap && !java.nio.file.Files.exists(fs.getPath(json.refmap))) {
                    json.remove('refmap')
                    java.nio.file.Files.write(cfg, groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)).getBytes('UTF-8'))
                }
            }
        }
    }
}
}
